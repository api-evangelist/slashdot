description: >-
  Slashdot is a technology news aggregation and community discussion site founded in 1997, focused on open source
  software, Linux, science, and technology topics. Known by its tagline "News for nerds, stuff that matters," Slashdot
  allows readers to submit and vote on stories, comment on articles, and follow developments across the technology
  landscape. The site offers RSS and Atom feeds for programmatic access to its content across multiple topic sections
  including developers, Linux, games, science, Apple, and more. Feed requests are rate-limited to one per 30 minutes.
